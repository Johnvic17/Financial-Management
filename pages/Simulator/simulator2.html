<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AF - Simulador</title>
    <link rel="stylesheet" href="../../style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="../../assets/favicon.ico">
</head>

<body>
    <div id="navbar"></div>

    <main>
        <section>
            <h1 class="mb-5 display-4 text-center">Simulador 50-30-20</h1>

            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">
                    <div class="bg-black text-white rounded p-4 p-md-5">
                        <form class="form-simulador">

                            <div class="d-flex flex-column flex-lg-row gap-4">

                                <!-- Formulário -->
                                <div class="w-100">
                                    <div class="mb-3">
                                        <label for="exampleInputEmail1" class="form-label">Renda Mensal</label>
                                        <input type="number" class="form-control" id="renda">
                                    </div>
                                    <div class="mb-3">
                                        <label for="exampleInputPassword1" class="form-label">Total gasto com Necessidades</label>
                                        <input type="number" class="form-control" id="necessidades">
                                    </div>
                                    <div class="mb-3">
                                        <label for="exampleInputPassword1" class="form-label">Total gasto com Desejos</label>
                                        <input type="number" class="form-control" id="desejos">
                                    </div>
                                    <div class="mb-3">
                                        <label for="exampleInputPassword1" class="form-label">Valor destinado à Poupança</label>
                                        <input type="number" class="form-control" id="poupanca">
                                    </div>
                                    <button type="submit" class="btn btn-primary justify-content-center w-100" id="calcular">Calcular</button>
                                </div>

                                <div class="vr d-none d-lg-block opacity-50"></div>
                                <hr class="d-lg-none my-0 opacity-50">

                                <div class="w-100" id="resultado">
                                    <p class="text-white-50 mb-0">
                                        Preencha os campos e clique em <strong>Calcular</strong> para ver a análise.
                                    </p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <div id="footer"></div>

    </main>
    <script src="../../js/simulator.js"></script>
    <script src="../../js/buttons.js"></script>
    <script src="../../js/NavbarLoader.js"></script>
    <script src="../../js/FooterLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
